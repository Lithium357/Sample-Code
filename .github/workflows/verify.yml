name: Verify standalone samples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install language tools
        run: sudo apt-get update && sudo apt-get install -y nim nasm ruby php-cli php-sqlite3 tcl binutils-riscv64-linux-gnu perl gawk lua5.4
      - name: Run Linux-compatible examples
        run: >-
          python3 tools/verify.py --require-tools
          --language nim --language assembly --language powershell --language sql
          --language bash --language rust --language ruby --language go --language php
          --report validation-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-linux-basic
          path: validation-linux.json
      - name: Run advanced Linux examples
        run: >-
          python3 tools/verify_advanced.py --require-tools --sanitize
          --language c --language cpp
          --language nim --language assembly --language powershell --language sql
          --language bash --language rust --language ruby --language go --language php
          --report validation-advanced-linux.json
      - name: Check Go examples with the race detector
        run: for source in advanced/go/*.go; do go run -race "$source" || exit; done
      - name: Source-bound research repair evidence
        run: python3 tools/research_validate.py --suite repairs --require-tools
      - name: Require normal self-checks and explicit assertion-disabled build rejection
        run: python3 tools/correction_probe.py --phase after
      - name: Source-bound existing-example evidence
        run: python3 tools/research_validate.py --suite legacy --skip-language cmd --require-tools
      - name: Install research emulator tooling
        run: python3 -m pip install keystone-engine==0.9.2 unicorn==2.1.4 tiktoken==0.14.0
      - name: Verify source/document review gates with genuine execution controls
        run: python3 tools/review_policy_probe.py --require-tools
      - name: Curated research checks (unavailable targets explicitly recorded)
        run: python3 tools/research_validate.py --suite curated
      - name: Curated Nim native backend
        run: python3 tools/research_validate.py --suite curated --only-language nim --native-nim --require-tools
      - name: Require Lua 5.4 execution
        run: python3 tools/research_validate.py --suite curated --only-language lua --require-tools
      - name: Require native NASM decoder fixture
        run: python3 tools/research_validate.py --path curated/assembly/x86_64/uleb32.asm --native-x86 --require-tools
      - name: Require RISC-V linked decoder emulation
        run: python3 tools/research_validate.py --path curated/assembly/riscv64/uleb32.s --require-tools
      - name: Race-check curated Go
        run: >-
          python3 tools/research_validate.py --path curated/go/local_http.go
          --path curated/go/keyed_work.go
          --path curated/go/conditional_snapshot.go
          --path advanced/go/dag_scheduler.go --path advanced/go/mvcc_store.go
          --path advanced/go/weighted_semaphore.go --go-race --require-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-linux-evidence
          path: research/evidence/history/*.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-linux-advanced
          path: validation-advanced-linux.json
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows examples
        run: python tools/verify.py --require-tools --language cmd --language powershell --language sql --report validation-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows-basic
          path: validation-windows.json
      - name: Run advanced Windows examples
        run: python tools/verify_advanced.py --require-tools --language cmd --language powershell --language sql --report validation-advanced-windows.json
      - name: Source-bound Windows fixtures
        run: python tools/research_validate.py --suite curated --only-language cmd --only-language powershell --require-tools
      - name: Source-bound existing CMD evidence
        run: python tools/research_validate.py --suite legacy --only-language cmd --require-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-windows-evidence
          path: research/evidence/history/*.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows-advanced
          path: validation-advanced-windows.json
  language-breadth:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Tcl, Perl and GNU AWK on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl perl gawk
      - name: Select Git-bundled Perl and GNU AWK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlPath=Join-Path $env:ProgramFiles 'Git\usr\bin\perl.exe'
          $awkPath=Join-Path $env:ProgramFiles 'Git\usr\bin\awk.exe'
          if (-not (Test-Path -LiteralPath $perlPath) -or -not (Test-Path -LiteralPath $awkPath)) { throw 'Bundled language runtime missing' }
          "MORDERCA_PERL=$perlPath" >> $env:GITHUB_ENV
          "MORDERCA_GAWK=$awkPath" >> $env:GITHUB_ENV
      - name: Validate language-breadth host-runtime contracts
        run: >-
          python tools/research_validate.py --suite curated
          --only-language python --only-language javascript --only-language fsharp
          --only-language csharp --only-language tcl
          --only-language perl --only-language awk-gawk
          --require-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-breadth-${{ matrix.os }}-evidence
          path: research/evidence/history/*.jsonl
  sqlserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: 'Developer'
          # Public, throwaway fixture password. No port is exposed to the host.
          MSSQL_SA_PASSWORD: 'LocalFixture_Only_48!'
          SQLCMDPASSWORD: 'LocalFixture_Only_48!'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Execute the retained T-SQL fixture on the owned local engine
        env:
          MORDERCA_SQLSERVER_LOCAL: '1'
          MORDERCA_SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
        run: python3 tools/research_validate.py --suite curated --only-language sql-tsql --require-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-sqlserver-evidence
          path: research/evidence/history/*.jsonl
  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - name: Install local fixture client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate PostgreSQL dialect with a disposable local database
        env:
          MORDERCA_POSTGRES_LOCAL: '1'
        run: python3 tools/research_validate.py --suite curated --only-language sql-postgresql --require-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-postgresql-evidence
          path: research/evidence/history/*.jsonl
